name: build-providers
on:
  push:
    branches: [providers-router-20261104]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare storage
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo mkdir -p /mnt/docker-data
          sudo systemctl stop docker
          echo '{"data-root":"/mnt/docker-data"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.providers
          platforms: linux/amd64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/serve_luche:providers-${{ github.sha }}
