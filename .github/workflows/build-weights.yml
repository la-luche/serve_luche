name: build-weights-image

# Builds ghcr.io/la-luche/serve_luche-weights:<revision> — a FROM-scratch image
# holding only the bf16-converted Sapiens2 pose checkpoint (~10 GB for 5b).
# Run MANUALLY, once per SAPIENS_MODEL_REVISION bump. The main build.yml then
# COPY --from's this image, so regular CI pushes never touch Hugging Face and
# the weights layer stays byte-identical (cached on GHCR and RunPod hosts).

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Sapiens2 HF model revision (commit sha)"
        required: false
        default: "ada1f29aa1fd454ca28665c700923a0101b6b24f"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af || true
          df -h

      - name: Convert checkpoint to bf16
        env:
          SAPIENS_MODEL_REVISION: ${{ inputs.revision }}
        run: |
          # mmap of the 20 GB fp32 file fails with ENOMEM under the runner's
          # default heuristic overcommit on 16 GB RAM; the bf16 dict (~10 GB)
          # also needs swap headroom. /mnt has ~65 GB scratch.
          sudo sysctl vm.overcommit_memory=1
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install safetensors huggingface_hub
          python tools/convert_checkpoint_bf16.py \
            --out weights/sapiens2_5b_pose.safetensors
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push weights image
        uses: docker/build-push-action@v6
        with:
          context: weights
          file: Dockerfile.weights
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/serve_luche-weights:${{ inputs.revision }}
