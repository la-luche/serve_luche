name: build-and-push

# Builds the portable Sapiens2 image (amd64) and pushes to GHCR. The bf16
# Sapiens weights (~10 GB) are baked in via COPY --from the data-only image
# built by build-weights.yml (run it once per model-revision bump BEFORE this).
# The DETR person detector is baked too. No HF token is required.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af || true
          # The weights layer makes the final image ~20 GB; give buildkit the
          # runner's big /mnt scratch disk instead of the near-full root disk.
          sudo mkdir -p /mnt/docker-data
          sudo systemctl stop docker
          echo '{"data-root": "/mnt/docker-data"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/serve_luche:${{ github.sha }}
          # Registry cache instead of type=gha: the baked-weights layer would
          # blow through the 10 GB Actions cache quota and thrash every build.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/serve_luche:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/serve_luche:buildcache,mode=max

      - name: Verify worker image is anonymously pullable
        run: |
          token="$(curl -fsSL \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/serve_luche:pull" \
            | jq -r .token)"
          test -n "$token"
          curl -fsSL -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/serve_luche/manifests/${{ github.sha }}"
