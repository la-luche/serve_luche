name: build-and-push

# Builds the portable Sapiens2 image (amd64) and pushes to GHCR. Weights are NOT
# baked (fetched at runtime), so the build is just buildx + push — no secrets,
# no HF token needed. GITHUB_TOKEN (auto) pushes to ghcr.io/skovorp/serve_luche.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/skovorp/serve_luche:latest
            ghcr.io/skovorp/serve_luche:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
