name: build-and-push

# Builds the portable Sapiens2 image (amd64) and pushes to GHCR. The 20 GB
# Sapiens weights are downloaded directly when a worker is replaced; the small
# public DETR person detector is baked at build time. No HF token is required.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/serve_luche:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify worker image is anonymously pullable
        run: |
          token="$(curl -fsSL \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/serve_luche:pull" \
            | jq -r .token)"
          test -n "$token"
          curl -fsSL -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/serve_luche/manifests/${{ github.sha }}"
